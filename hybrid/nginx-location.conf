# Include inside your existing TLS server block; replace duplicate locations.
# Keep management port 4312 private. Public requests go ONLY to 4311.
location / {
    proxy_pass http://127.0.0.1:4311;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Do not buffer the original Pi streaming response in Nginx.
location = /admin/pi {
    proxy_pass http://127.0.0.1:4311;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}
