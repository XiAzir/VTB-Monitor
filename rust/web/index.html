<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VTB Monitor</title><style>
:root{font-family:system-ui,sans-serif;color:#1d2834;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#142536;color:white;padding:18px 5vw;display:flex;gap:22px;align-items:center;flex-wrap:wrap}header h1{font-size:21px;margin:0}header a{color:inherit;text-decoration:none}main{max-width:1120px;padding:24px;margin:auto}button,input,textarea,select{font:inherit;border:1px solid #bbc4ce;border-radius:6px;padding:9px}button{cursor:pointer;background:white}button:hover{background:#e9f0f6}button:disabled{opacity:.5}input,select,textarea{max-width:100%;background:white}textarea{width:100%;min-height:150px;resize:vertical;font-family:ui-monospace,monospace;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card,article,form{background:white;border:1px solid #dbe1e6;border-radius:10px;padding:18px;margin-bottom:16px}h2{font-size:23px}h3{font-size:18px}p{line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#667585;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.error{color:#a42626;background:#fff0f0;padding:14px;border-radius:8px}label{display:block;margin:12px 0}label span{display:block;font-size:14px;margin-bottom:6px}img{max-width:100%;max-height:650px;object-fit:contain;border-radius:8px}pre{overflow:auto;max-height:550px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{border-top:1px solid #ddd;padding-top:8px;margin-top:12px}summary{cursor:pointer}a{color:#075e9c}.pill{display:inline-block;background:#e8edf2;padding:4px 8px;border-radius:20px;font-size:12px}footer{margin:40px 0;color:#657383;font-size:12px}#busy{margin-left:auto;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap}small{line-height:1.6}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #eee;padding:8px}code{overflow-wrap:anywhere}
</style><script src="/app.js" defer></script></head><body><header><h1><a href="#">VTB Monitor</a></h1><nav><a href="#">主播</a><a href="#admin">后台</a><a href="#drafts">周表审核</a><a href="#chat">管理助手</a></nav><span id="busy"></span></header><main id="app" aria-live="polite"></main></body></html>
