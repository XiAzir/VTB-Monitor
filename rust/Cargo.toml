[package]
name = "vtb-monitor-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[features]
default = []
bench-ablation = []

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
md5 = "0.7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "fs", "sync", "time", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
url = "2.5"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
