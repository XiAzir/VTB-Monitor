name: Original UI and TypeScript Pi validation
on:
  push:
    branches: [refactor/original-ui-typescript-pi]
    paths: ['.github/workflows/ui-pi-parity.yml', 'hybrid-validation.trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ui-pi-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize reviewed source edits on this branch
        run: |
          if test -f hybrid/integrate.py; then
            python3 hybrid/integrate.py
            rm hybrid/integrate.py
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add hybrid/integrate.py rust/Cargo.toml rust/src src
            git commit -m 'refactor: integrate original Svelte UI and original TypeScript Pi with Rust supervisor'
            git push origin HEAD:refactor/original-ui-typescript-pi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: hybrid-rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
      - name: Capture environment and source parity
        run: |
          mkdir -p hybrid/results
          { git rev-parse HEAD; node --version; npm --version; rustc --version; uname -a; } | tee hybrid/results/environment.txt
          git diff cdb62d9fe1dd0b52f710194a81df2b80872d986d -- '*.svelte' '*.css' > hybrid/results/ui-source.diff
          test ! -s hybrid/results/ui-source.diff
          node --check hybrid/sidecar.mjs
          python3 -m py_compile hybrid/acceptance.py
      - name: Original dependency installation
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee hybrid/results/npm-ci.log
      - name: Original Svelte and TypeScript checks
        run: |
          set -o pipefail
          npm run check 2>&1 | tee hybrid/results/check.log
          npm test 2>&1 | tee hybrid/results/tests.log
          npm run build 2>&1 | tee hybrid/results/build.log
      - name: Rust checks and build
        run: |
          set -o pipefail
          cd rust
          cargo test --all-targets 2>&1 | tee ../hybrid/results/rust-tests.log
          cargo build --release --bin vtb-monitor-rs 2>&1 | tee ../hybrid/results/rust-build.log
      - name: Original browser workflows against Rust entry point
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium
          npx playwright test --config hybrid/playwright.config.ts 2>&1 | tee hybrid/results/browser.log
      - name: Real TypeScript Pi with all backend processes limited to 150 MiB
        if: ${{ !cancelled() && hashFiles('rust/target/release/vtb-monitor-rs') != '' && hashFiles('build/handler.js') != '' }}
        run: |
          set -o pipefail
          sudo env PATH="$PATH" python3 hybrid/acceptance.py --binary rust/target/release/vtb-monitor-rs --memory-mib 150 2>&1 | tee hybrid/results/integration.log
      - name: Package exact source and results
        if: always()
        run: |
          mkdir -p hybrid/results
          git archive --format=tar.gz -o /tmp/vtbm-hybrid-source.tar.gz HEAD
          cp /tmp/vtbm-hybrid-source.tar.gz hybrid/results/
          if test -f rust/target/release/vtb-monitor-rs; then cp rust/target/release/vtb-monitor-rs hybrid/results/; fi
          if test -f rust/Cargo.lock; then cp rust/Cargo.lock hybrid/results/; fi
          git status --short > hybrid/results/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-pi-parity-results
          path: |
            hybrid/results/
            test-results/
          retention-days: 30
