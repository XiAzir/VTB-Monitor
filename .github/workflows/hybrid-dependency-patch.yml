name: Patch hybrid mail dependency
on:
  push:
    branches: [refactor/original-ui-typescript-pi]
    paths: [.github/workflows/hybrid-dependency-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/refactor/original-ui-typescript-pi'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/original-ui-typescript-pi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update only the reviewed mail package and its lock
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact nodemailer@9.1.1
          npm ci --ignore-scripts
          npm audit --omit=dev
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): update nodemailer to 9.1.1 security patch'
            git push origin HEAD:refactor/original-ui-typescript-pi
          fi
