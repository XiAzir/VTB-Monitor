name: Apply reviewed Pi terminal submission fix
on:
  push:
    branches: [refactor/original-ui-typescript-pi]
    paths: [.github/workflows/hybrid-terminal-patch.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/original-ui-typescript-pi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exactly the reviewed Pi patch and pin Rust resolution
        run: |
          git apply --check hybrid/terminal-submission.patch
          git apply hybrid/terminal-submission.patch
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/server/pi.ts rust/Cargo.lock
          git commit -m 'fix(pi): finish terminal submissions after all tools; pin Rust dependencies'
          git push origin HEAD:refactor/original-ui-typescript-pi
      - name: Original implementation checks and build
        run: |
          mkdir -p hybrid/results
          git rev-parse HEAD > hybrid/results/tested-source-commit.txt
          npm ci --ignore-scripts
          npm audit --omit=dev
          npm run check
          npm test
          node --test hybrid/request-memory.test.mjs
          npm run build
          cargo test --manifest-path rust/Cargo.toml --all-targets --locked
          cargo build --manifest-path rust/Cargo.toml --release --bin vtb-monitor-rs --locked
      - name: Same total 150 MiB cap and same 9 MiB image
        run: |
          set -o pipefail
          sudo env PATH="$PATH" python3 hybrid/acceptance.py --memory-mib 150 2>&1 | tee hybrid/results/integration.log
      - name: Archive tested source
        if: always()
        run: |
          mkdir -p hybrid/results
          git archive --format=tar.gz -o /tmp/source.tar.gz HEAD
          cp /tmp/source.tar.gz hybrid/results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-fix-results
          path: hybrid/results/
          retention-days: 14
